<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantara — Vehicle Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#15171a;
    --panel:#1f2226;
    --panel-raised:#262a2f;
    --hairline:#33383e;
    --paper:#eae6da;
    --paper-dim:#a9a49a;
    --chrome:#8b929a;
    --amber:#f2a93b;
    --amber-dim:#c78a2e;
    --amber-ink:#3a2708;
    --rust:#d6603f;
    --rust-ink:#3a1608;
    --green:#5fb583;
    --green-ink:#0e2c1b;
    --blue:#5c93c9;
    --blue-ink:#0c2436;
    --radius:3px;
    --shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(242,169,59,0.05), transparent 45%),
      var(--asphalt);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding-bottom:4rem;
  }
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  header{
    border-bottom:1px solid var(--hairline);
    padding:1.6rem 2rem 1.4rem;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand{display:flex; align-items:center; gap:0.9rem;}
  .brand-mark{
    width:44px;height:44px;border:2px solid var(--amber);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--amber); font-weight:700; font-family:'Oswald',sans-serif; font-size:19px;
    flex-shrink:0;
  }
  h1{margin:0; font-size:26px; font-weight:600; color:var(--paper);}
  .tagline{margin:2px 0 0; font-size:12.5px; color:var(--chrome); letter-spacing:0.12em; text-transform:uppercase;}
  .headerdate{font-size:12px; color:var(--paper-dim); text-align:right;}
  .headerdate .mono{color:var(--amber); font-size:13px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:1px;
    background:var(--hairline);
    border-bottom:1px solid var(--hairline);
  }
  .stat{background:var(--panel); padding:1rem 1.4rem;}
  .stat .num{font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; color:var(--paper);}
  .stat .lbl{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome); margin-top:2px;}
  .stat.warn .num{color:var(--rust);}
  .stat.go .num{color:var(--green);}
  .stat.money .num{color:var(--amber);}

  .toolbar{
    display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;
    padding:1.2rem 2rem 0.4rem;
  }
  input[type=text], input[type=search], select, textarea, input[type=number], input[type=date]{
    background:var(--panel-raised);
    border:1px solid var(--hairline);
    color:var(--paper);
    padding:0.55rem 0.75rem;
    border-radius:var(--radius);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
  }
  input:focus, select:focus, textarea:focus{outline:1px solid var(--amber); border-color:var(--amber);}
  .search-wrap{position:relative; flex:1; min-width:200px;}
  .search-wrap input{width:100%; padding-left:2.1rem;}
  .search-wrap svg{position:absolute; left:0.65rem; top:50%; transform:translateY(-50%); opacity:0.5;}
  .chips{display:flex; gap:0.4rem; flex-wrap:wrap;}
  .chip{
    padding:0.45rem 0.85rem; border-radius:20px; border:1px solid var(--hairline);
    font-size:12px; letter-spacing:0.03em; cursor:pointer; color:var(--paper-dim);
    background:var(--panel); transition:all .12s;
  }
  .chip:hover{border-color:var(--amber-dim); color:var(--paper);}
  .chip.active{background:var(--amber); border-color:var(--amber); color:var(--amber-ink); font-weight:600;}
  .btn{
    background:var(--amber); color:var(--amber-ink); border:none; font-weight:600;
    padding:0.6rem 1.1rem; border-radius:var(--radius); cursor:pointer; font-size:13.5px;
    display:inline-flex; align-items:center; gap:0.4rem; white-space:nowrap;
  }
  .btn:hover{background:#ffb84f;}
  .btn.ghost{background:transparent; color:var(--paper); border:1px solid var(--hairline);}
  .btn.ghost:hover{border-color:var(--amber-dim);}
  .btn.danger{background:transparent; color:var(--rust); border:1px solid var(--rust);}
  .btn.danger:hover{background:var(--rust); color:#fff;}
  .btn.sm{padding:0.4rem 0.7rem; font-size:12px;}

  .board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:1.1rem;
    padding:1.2rem 2rem 2rem;
  }
  .ticket{
    position:relative;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-left:4px solid var(--amber-dim);
    border-radius:var(--radius);
    padding:1.1rem 1.2rem 1rem;
    cursor:pointer;
    transition:transform .1s, box-shadow .1s;
  }
  .ticket:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-left-color:var(--amber);}
  .ticket.st-done{border-left-color:var(--green);}
  .ticket.st-parts{border-left-color:var(--rust);}
  .ticket.st-diag{border-left-color:var(--blue);}
  .ticket.st-ready{border-left-color:var(--amber);}

  .stamp{
    position:absolute; top:0.9rem; right:0.9rem;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:10.5px;
    letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 9px; border-radius:2px;
    transform:rotate(3deg);
    border:1.5px solid currentColor;
  }
  .stamp.st-diag{color:var(--blue); background:var(--blue-ink);}
  .stamp.st-progress{color:var(--amber); background:var(--amber-ink);}
  .stamp.st-parts{color:var(--rust); background:var(--rust-ink);}
  .stamp.st-ready{color:var(--amber); background:var(--amber-ink);}
  .stamp.st-done{color:var(--green); background:var(--green-ink);}

  .ticket-plate{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:13px; background:var(--paper); color:#1a1a1a; padding:2px 8px;
    border-radius:2px; letter-spacing:0.05em; margin-bottom:0.55rem;
  }
  .ticket h3{margin:0 0 2px; font-size:17px; font-weight:600; color:var(--paper); padding-right:5.5rem;}
  .ticket .owner{font-size:12.5px; color:var(--chrome); margin-bottom:0.7rem;}
  .ticket .complaint-line{
    font-size:12.5px; color:var(--paper-dim); margin-bottom:0.15rem;
    display:flex; gap:6px; align-items:flex-start;
  }
  .ticket .complaint-line svg{flex-shrink:0; margin-top:2px; opacity:0.6;}
  .ticket-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:0.8rem; padding-top:0.7rem; border-top:1px dashed var(--hairline);
    font-size:12px; color:var(--chrome);
  }
  .ticket-cost{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-weight:600; font-size:13.5px;}

  .empty{
    grid-column:1/-1; text-align:center; padding:4rem 1rem; color:var(--chrome);
  }
  .empty .display{font-size:20px; color:var(--paper-dim); margin-bottom:0.4rem;}

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(10,11,12,0.72);
    align-items:flex-start; justify-content:center; z-index:50; padding:3.5vh 1rem; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--hairline); border-radius:6px;
    width:100%; max-width:560px; box-shadow:var(--shadow);
    max-height:93vh; display:flex; flex-direction:column;
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:1.1rem 1.3rem; border-bottom:1px solid var(--hairline);
  }
  .modal-head h2{margin:0; font-size:18px; font-weight:600;}
  .modal-body{padding:1.2rem 1.3rem; overflow-y:auto;}
  .modal-foot{padding:1rem 1.3rem; border-top:1px solid var(--hairline); display:flex; justify-content:flex-end; gap:0.6rem;}
  .x-btn{background:none; border:none; color:var(--chrome); cursor:pointer; font-size:20px; line-height:1;}
  .x-btn:hover{color:var(--paper);}

  .field{margin-bottom:0.85rem;}
  .field label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--chrome); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.8rem;}
  textarea{resize:vertical; min-height:56px; font-family:'IBM Plex Sans',sans-serif;}
  .section-lbl{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--amber); margin:1.2rem 0 0.6rem; padding-top:0.9rem; border-top:1px solid var(--hairline);
  }
  .section-lbl:first-child{margin-top:0; padding-top:0; border-top:none;}

  .list-row{
    display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;
  }
  .list-row input{flex:1;}
  .icon-btn{
    background:none; border:1px solid var(--hairline); color:var(--chrome);
    width:32px; height:32px; border-radius:var(--radius); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{border-color:var(--rust); color:var(--rust);}

  .log-entry{
    border-left:2px solid var(--hairline); padding:0 0 0.7rem 0.8rem; margin-bottom:0.7rem; position:relative;
  }
  .log-entry::before{content:''; position:absolute; left:-4.5px; top:2px; width:7px; height:7px; border-radius:50%; background:var(--amber);}
  .log-entry .ts{font-size:10.5px; color:var(--chrome); font-family:'IBM Plex Mono',monospace;}
  .log-entry .txt{font-size:13px; color:var(--paper); margin-top:2px;}

  .detail-hero{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap;}
  .status-select{width:auto;}
  .cost-line{display:flex; justify-content:space-between; font-size:13.5px; padding:0.35rem 0; border-bottom:1px dashed var(--hairline);}
  .cost-line.total{font-weight:600; color:var(--amber); border-bottom:none; padding-top:0.6rem; font-size:15px;}
  .cost-line .mono{font-family:'IBM Plex Mono',monospace;}

  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;}

  @media(max-width:640px){
    .row2, .row3{grid-template-columns:1fr;}
    header{padding:1.2rem 1.1rem;}
    .toolbar, .board{padding-left:1.1rem; padding-right:1.1rem;}
  }
</style>
</head>
<body>
<h1 class="sr-only">Vantara vehicle intake and repair tracking board</h1>

<header>
  <div class="brand">
    <div class="brand-mark">V</div>
    <div>
      <h1 class="display">Vantara</h1>
      <p class="tagline">The journey behind every repair</p>
    </div>
  </div>
  <div class="headerdate">
    <div id="today-str">—</div>
    <div class="mono" id="bay-count">0 vehicles on the floor</div>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="search" placeholder="Search plate, owner, make, model, VIN…">
  </div>
  <div class="chips" id="filters"></div>
  <button class="btn" id="new-btn">+ New intake</button>
</div>

<div class="board" id="board"></div>

<!-- Intake / Edit Modal -->
<div class="overlay" id="intake-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="intake-title">New intake</h2>
      <button class="x-btn" data-close="intake-overlay">&times;</button>
    </div>
    <div class="modal-body">
      <div class="section-lbl">Vehicle</div>
      <div class="row3">
        <div class="field"><label>Make</label><input type="text" id="f-make" placeholder="Toyota"></div>
        <div class="field"><label>Model</label><input type="text" id="f-model" placeholder="Hilux"></div>
        <div class="field"><label>Year</label><input type="text" id="f-year" placeholder="2019"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Plate number</label><input type="text" id="f-plate" placeholder="KL 07 AB 1234"></div>
        <div class="field"><label>VIN / chassis no.</label><input type="text" id="f-vin" placeholder="Optional"></div>
      </div>

      <div class="section-lbl">Owner</div>
      <div class="row2">
        <div class="field"><label>Owner name</label><input type="text" id="f-owner" placeholder="Full name"></div>
        <div class="field"><label>Phone</label><input type="text" id="f-phone" placeholder="+91…"></div>
      </div>
      <div class="field"><label>Date brought in</label><input type="date" id="f-date"></div>

      <div class="section-lbl">Complaints reported</div>
      <div id="complaint-rows"></div>
      <button class="btn ghost sm" id="add-complaint">+ Add complaint</button>

      <div class="section-lbl">Estimated / current costs</div>
      <div class="row2">
        <div class="field"><label>Parts cost</label><input type="number" id="f-parts" placeholder="0" min="0"></div>
        <div class="field"><label>Labor cost</label><input type="number" id="f-labor" placeholder="0" min="0"></div>
      </div>

      <div class="section-lbl">Status</div>
      <div class="field">
        <select id="f-status">
          <option value="diag">Awaiting diagnosis</option>
          <option value="progress">In progress</option>
          <option value="parts">Awaiting parts</option>
          <option value="ready">Ready for pickup</option>
          <option value="done">Completed / picked up</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="intake-overlay">Cancel</button>
      <button class="btn" id="save-btn">Save vehicle</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detail-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detail-title">Vehicle</h2>
      <button class="x-btn" data-close="detail-overlay">&times;</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-foot">
      <button class="btn danger" id="delete-btn">Remove ticket</button>
      <button class="btn ghost" id="edit-btn">Edit details</button>
    </div>
  </div>
</div>

<script>
const STATUSES = {
  diag:     { label:'Awaiting diagnosis', cls:'st-diag',    stamp:'st-diag' },
  progress: { label:'In progress',        cls:'',           stamp:'st-progress' },
  parts:    { label:'Awaiting parts',     cls:'st-parts',   stamp:'st-parts' },
  ready:    { label:'Ready for pickup',   cls:'st-ready',   stamp:'st-ready' },
  done:     { label:'Completed',          cls:'st-done',    stamp:'st-done' },
};

let vehicles = [];
let activeFilter = 'all';
let searchTerm = '';
let editingId = null;
let detailId = null;

const fmtMoney = n => '₹' + Number(n||0).toLocaleString('en-IN');

async function loadVehicles(){
  try{
    const res = await window.storage.get('vehicles', true);
    vehicles = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    vehicles = [];
  }
  render();
}

async function saveVehicles(){
  try{
    await window.storage.set('vehicles', JSON.stringify(vehicles), true);
  }catch(e){
    console.error('Storage error', e);
  }
}

function uid(){ return 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayStr(){
  const d = new Date();
  document.getElementById('today-str').textContent = d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function renderStats(){
  const total = vehicles.length;
  const counts = {};
  Object.keys(STATUSES).forEach(k => counts[k] = vehicles.filter(v=>v.status===k).length);
  const outstanding = vehicles.filter(v=>v.status!=='done')
    .reduce((sum,v)=> sum + Number(v.parts||0) + Number(v.labor||0), 0);
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Total vehicles</div></div>
    <div class="stat warn"><div class="num">${counts.progress + counts.diag}</div><div class="lbl">Active jobs</div></div>
    <div class="stat warn"><div class="num">${counts.parts}</div><div class="lbl">Awaiting parts</div></div>
    <div class="stat go"><div class="num">${counts.ready}</div><div class="lbl">Ready for pickup</div></div>
    <div class="stat money"><div class="num">${fmtMoney(outstanding)}</div><div class="lbl">Outstanding on floor</div></div>
  `;
  document.getElementById('bay-count').textContent = `${total} vehicle${total!==1?'s':''} on the floor`;
}

function renderFilters(){
  const el = document.getElementById('filters');
  const opts = [['all','All']].concat(Object.entries(STATUSES).map(([k,v])=>[k,v.label]));
  el.innerHTML = opts.map(([k,label]) =>
    `<div class="chip ${activeFilter===k?'active':''}" data-filter="${k}">${label}</div>`
  ).join('');
  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', ()=>{
    activeFilter = c.dataset.filter; render();
  }));
}

function matchesSearch(v){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return [v.make,v.model,v.plate,v.vin,v.owner].filter(Boolean).some(f => f.toLowerCase().includes(t));
}

function renderBoard(){
  const board = document.getElementById('board');
  let list = vehicles.filter(v => (activeFilter==='all' || v.status===activeFilter) && matchesSearch(v));
  list = list.slice().sort((a,b)=> (b.dateIn||'').localeCompare(a.dateIn||''));

  if(list.length===0){
    board.innerHTML = `<div class="empty">
      <div class="display">No tickets here</div>
      <div>${vehicles.length===0 ? 'Bring in your first vehicle to open a work order.' : 'Nothing matches that filter or search.'}</div>
    </div>`;
    return;
  }

  board.innerHTML = list.map(v => {
    const st = STATUSES[v.status] || STATUSES.diag;
    const total = Number(v.parts||0) + Number(v.labor||0);
    const complaints = (v.complaints||[]).slice(0,3);
    return `
    <div class="ticket ${st.cls}" data-id="${v.id}">
      <div class="stamp ${st.stamp}">${st.label}</div>
      <div class="ticket-plate">${escapeHtml(v.plate || 'No plate')}</div>
      <h3>${escapeHtml(v.make||'')} ${escapeHtml(v.model||'')} ${v.year? '· '+escapeHtml(v.year):''}</h3>
      <div class="owner">${escapeHtml(v.owner||'Owner not set')}${v.phone? ' · '+escapeHtml(v.phone):''}</div>
      ${complaints.map(c=>`<div class="complaint-line"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><span>${escapeHtml(c)}</span></div>`).join('')}
      ${(v.complaints||[]).length>3 ? `<div class="complaint-line" style="opacity:.7">+${v.complaints.length-3} more</div>` : ''}
      <div class="ticket-meta">
        <span>In: ${v.dateIn || '—'}</span>
        <span class="ticket-cost">${fmtMoney(total)}</span>
      </div>
    </div>`;
  }).join('');

  board.querySelectorAll('.ticket').forEach(t => t.addEventListener('click', () => openDetail(t.dataset.id)));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderStats();
  renderFilters();
  renderBoard();
}

// ---- Intake modal ----
function openIntake(existing){
  editingId = existing ? existing.id : null;
  document.getElementById('intake-title').textContent = existing ? 'Edit vehicle' : 'New intake';
  document.getElementById('f-make').value = existing?.make || '';
  document.getElementById('f-model').value = existing?.model || '';
  document.getElementById('f-year').value = existing?.year || '';
  document.getElementById('f-plate').value = existing?.plate || '';
  document.getElementById('f-vin').value = existing?.vin || '';
  document.getElementById('f-owner').value = existing?.owner || '';
  document.getElementById('f-phone').value = existing?.phone || '';
  document.getElementById('f-date').value = existing?.dateIn || new Date().toISOString().slice(0,10);
  document.getElementById('f-parts').value = existing?.parts || '';
  document.getElementById('f-labor').value = existing?.labor || '';
  document.getElementById('f-status').value = existing?.status || 'diag';

  const rowsEl = document.getElementById('complaint-rows');
  rowsEl.innerHTML = '';
  const complaints = existing?.complaints?.length ? existing.complaints : [''];
  complaints.forEach(c => addComplaintRow(c));

  document.getElementById('intake-overlay').classList.add('open');
}

function addComplaintRow(value=''){
  const rowsEl = document.getElementById('complaint-rows');
  const row = document.createElement('div');
  row.className = 'list-row';
  row.innerHTML = `<input type="text" placeholder="e.g. Grinding noise from front brakes" value="${escapeHtml(value)}">
    <button type="button" class="icon-btn" aria-label="Remove complaint">&times;</button>`;
  row.querySelector('.icon-btn').addEventListener('click', () => row.remove());
  rowsEl.appendChild(row);
}

document.getElementById('add-complaint').addEventListener('click', () => addComplaintRow());
document.getElementById('new-btn').addEventListener('click', () => openIntake(null));

document.getElementById('save-btn').addEventListener('click', async () => {
  const complaints = Array.from(document.querySelectorAll('#complaint-rows input'))
    .map(i => i.value.trim()).filter(Boolean);

  const data = {
    make: document.getElementById('f-make').value.trim(),
    model: document.getElementById('f-model').value.trim(),
    year: document.getElementById('f-year').value.trim(),
    plate: document.getElementById('f-plate').value.trim(),
    vin: document.getElementById('f-vin').value.trim(),
    owner: document.getElementById('f-owner').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    dateIn: document.getElementById('f-date').value,
    complaints,
    parts: Number(document.getElementById('f-parts').value || 0),
    labor: Number(document.getElementById('f-labor').value || 0),
    status: document.getElementById('f-status').value,
  };

  if(!data.make && !data.plate){
    alert('Add at least a make or a plate number so this ticket can be found later.');
    return;
  }

  if(editingId){
    const idx = vehicles.findIndex(v => v.id === editingId);
    if(idx > -1){
      const prevStatus = vehicles[idx].status;
      vehicles[idx] = { ...vehicles[idx], ...data };
      if(prevStatus !== data.status){
        vehicles[idx].log = vehicles[idx].log || [];
        vehicles[idx].log.unshift({ ts: new Date().toISOString(), txt: `Status changed to "${STATUSES[data.status].label}"` });
      }
    }
  } else {
    vehicles.unshift({
      id: uid(),
      ...data,
      log: [{ ts: new Date().toISOString(), txt: 'Vehicle checked in' }],
    });
  }

  await saveVehicles();
  closeOverlay('intake-overlay');
  render();
});

// ---- Detail modal ----
function openDetail(id){
  detailId = id;
  const v = vehicles.find(x => x.id === id);
  if(!v) return;
  const st = STATUSES[v.status] || STATUSES.diag;
  const total = Number(v.parts||0) + Number(v.labor||0);

  document.getElementById('detail-title').textContent = `${v.make||''} ${v.model||''}`.trim() || 'Vehicle';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-hero">
      <div>
        <div class="ticket-plate">${escapeHtml(v.plate||'No plate')}</div>
        <div style="font-size:13px;color:var(--chrome);margin-top:6px;">${escapeHtml(v.owner||'Owner not set')}${v.phone?' · '+escapeHtml(v.phone):''}</div>
        <div style="font-size:12px;color:var(--paper-dim);margin-top:3px;">In: ${v.dateIn||'—'} ${v.vin? '· VIN '+escapeHtml(v.vin):''}</div>
      </div>
      <select id="status-select" class="status-select">
        ${Object.entries(STATUSES).map(([k,s]) => `<option value="${k}" ${v.status===k?'selected':''}>${s.label}</option>`).join('')}
      </select>
    </div>

    <div class="section-lbl">Complaints reported</div>
    ${(v.complaints||[]).length ? (v.complaints||[]).map(c=>`<div class="complaint-line" style="margin-bottom:6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>${escapeHtml(c)}</div>`).join('') : '<div style="color:var(--chrome);font-size:13px;">No complaints logged.</div>'}

    <div class="section-lbl">Repair costs</div>
    <div class="cost-line"><span>Parts</span><span class="mono">${fmtMoney(v.parts)}</span></div>
    <div class="cost-line"><span>Labor</span><span class="mono">${fmtMoney(v.labor)}</span></div>
    <div class="cost-line total"><span>Total</span><span class="mono">${fmtMoney(total)}</span></div>

    <div class="section-lbl">Work progress</div>
    <div class="list-row">
      <input type="text" id="new-note" placeholder="Add a progress note…">
      <button type="button" class="icon-btn" id="add-note-btn" aria-label="Add note">+</button>
    </div>
    <div id="log-list">
      ${(v.log||[]).map(l => `<div class="log-entry"><div class="ts">${new Date(l.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><div class="txt">${escapeHtml(l.txt)}</div></div>`).join('') || '<div style="color:var(--chrome);font-size:13px;">No progress logged yet.</div>'}
    </div>
  `;

  document.getElementById('status-select').addEventListener('change', async (e) => {
    const newStatus = e.target.value;
    if(newStatus !== v.status){
      v.log = v.log || [];
      v.log.unshift({ ts:new Date().toISOString(), txt:`Status changed to "${STATUSES[newStatus].label}"` });
      v.status = newStatus;
      await saveVehicles();
      render();
    }
  });

  document.getElementById('add-note-btn').addEventListener('click', async () => {
    const input = document.getElementById('new-note');
    const txt = input.value.trim();
    if(!txt) return;
    v.log = v.log || [];
    v.log.unshift({ ts:new Date().toISOString(), txt });
    await saveVehicles();
    openDetail(id);
  });

  document.getElementById('detail-overlay').classList.add('open');
}

document.getElementById('edit-btn').addEventListener('click', () => {
  const v = vehicles.find(x => x.id === detailId);
  closeOverlay('detail-overlay');
  openIntake(v);
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if(!confirm('Remove this ticket permanently?')) return;
  vehicles = vehicles.filter(v => v.id !== detailId);
  await saveVehicles();
  closeOverlay('detail-overlay');
  render();
});

function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => { if(e.target === ov) closeOverlay(ov.id); });
});

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

todayStr();
loadVehicles();
</script>
</body>
</html>
